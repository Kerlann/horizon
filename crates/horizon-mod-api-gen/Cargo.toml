[package]
name = "horizon-mod-api-gen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Build-time typed native mod API generation"

[dependencies]
horizon-mod-point-shape = { path = "../horizon-mod-point-shape" }
heck = "0.5"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1"

[[bin]]
name = "horizon-stage"
path = "src/bin/horizon-stage.rs"

[dev-dependencies]
wit-parser = "0.261"

[lints]
workspace = true
