id = "lib_tail"
name = "Library tail"
version = "1.0.0"
description = "Depends on counter_lib and appends L to a chat input at its point, for tests/refused_points.rs."
api = "0.2"
side = "both"
capabilities = ["registries"]

[dependencies]
counter_lib = "^1"

[[native.injection]]
id = "tail"
target = "horizon_client::game::chat::Game<'_>::handle_chat_input"
kind = "HEAD"
trait_method = "handle_chat_input"
