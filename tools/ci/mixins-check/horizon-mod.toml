# CI's horizon-mixins check (#1102): a point injection and a helper injection, built by the
# launcher at the checked-out commit. tools/ci/mixins_check.sh fills in `horizon`.
id = "mixins_check"
name = "Mixins check"
version = "0.1.0"
description = "CI: a point injection and a helper injection through horizon-mixins"
authors = []
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "HEAD"
mixins = "d9c83d7096b7ea5b83678da2efdfd6161f74997e"

[[native.injection]]
id = "tick"
target = "horizon_client::game::Game<'_>::tick"
kind = "HEAD"
trait_method = "tick"

[[native.injection]]
id = "count"
target = "horizon_client::game::Game<'_>::tick_mobs"
kind = "HEAD"
helper = "src/count.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]
