name: native dylib linkage probe

# Probe only: no release, mod loader, or player data. Open the probe PR only
# after the local gates pass; its ready head receives one cross-platform run.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # Dependency-set changes, not source edits: newly packaged crates need the probe.
      - 'crates/horizon-addresses/Cargo.toml'
      - 'crates/horizon-anticheat/Cargo.toml'
      - 'crates/horizon-assets/Cargo.toml'
      - 'crates/horizon-bench/Cargo.toml'
      - 'crates/horizon-chat-filter/Cargo.toml'
      - 'crates/horizon-client-core/Cargo.toml'
      - 'crates/horizon-client-input/Cargo.toml'
      - 'crates/horizon-client-lib/Cargo.toml'
      - 'crates/horizon-client-render/Cargo.toml'
      - 'crates/horizon-client/Cargo.toml'
      - 'crates/horizon-command/Cargo.toml'
      - 'crates/horizon-core/Cargo.toml'
      - 'crates/horizon-cosmetics/Cargo.toml'
      - 'crates/horizon-dualsense/Cargo.toml'
      - 'crates/horizon-engine-slots/Cargo.toml'
      - 'crates/horizon-friends/Cargo.toml'
      - 'crates/horizon-game-discovery/Cargo.toml'
      - 'crates/horizon-hdr/Cargo.toml'
      - 'crates/horizon-hooks/Cargo.toml'
      - 'crates/horizon-items/Cargo.toml'
      - 'crates/horizon-mcp/Cargo.toml'
      - 'crates/horizon-mod-api-gen/Cargo.toml'
      - 'crates/horizon-mod-api-macros/Cargo.toml'
      - 'crates/horizon-mod-api/Cargo.toml'
      - 'crates/horizon-mod-host/Cargo.toml'
      - 'crates/horizon-mod-package/Cargo.toml'
      - 'crates/horizon-mod-point-emit/Cargo.toml'
      - 'crates/horizon-mod-point-shape/Cargo.toml'
      - 'crates/horizon-mod-points/Cargo.toml'
      - 'crates/horizon-mod-render/Cargo.toml'
      - 'crates/horizon-mod-runtime/Cargo.toml'
      - 'crates/horizon-mod-vocab/Cargo.toml'
      - 'crates/horizon-mod-wasm/Cargo.toml'
      - 'crates/horizon-narrator/Cargo.toml'
      - 'crates/horizon-optifine/Cargo.toml'
      - 'crates/horizon-platform/Cargo.toml'
      - 'crates/horizon-polytone/Cargo.toml'
      - 'crates/horizon-protocol/Cargo.toml'
      - 'crates/horizon-server-files/Cargo.toml'
      - 'crates/horizon-shader-api/Cargo.toml'
      - 'crates/horizon-shaders/Cargo.toml'
      - 'crates/horizon-system/Cargo.toml'
      - 'crates/horizon-telemetry/Cargo.toml'
      - 'crates/horizon-theme/Cargo.toml'
      - 'crates/horizon-threads/Cargo.toml'
      - 'crates/horizon-world/Cargo.toml'
      - 'third_party/libmimalloc-sys/Cargo.toml'
      - 'third_party/naga/Cargo.toml'
      - 'third_party/wgpu-hal/Cargo.toml'
      - 'tools/native_dylib_probe.py'
      - 'tools/native_dylib_probe/**'
      - 'tools/prebuilt_game.py'
      - '.github/workflows/native-dylib-probe.yml'
      - 'launcher/src/rust_toolchain.rs'
      - 'rust-toolchain*'

permissions:
  contents: read

concurrency:
  group: native-dylib-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkage:
    if: github.event.pull_request.draft == false
    name: linkage ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Match the launcher's actual compiler host, not Windows MSVC.
          - os: windows-latest
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record exact head and select the launcher's pinned compiler
        id: rust
        run: |
          git rev-parse HEAD
          echo "version=$(sed -n 's/^pub const VERSION: &str = "\(.*\)";$/\1/p' launcher/src/rust_toolchain.rs)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}-${{ matrix.target }}
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-dylib-probe-${{ matrix.target }}
      - name: Linux SDK prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Exact compiler identity
        run: rustc -vV
      - name: Build the unmodified prebuilt SDK topology
        run: python tools/prebuilt_game.py build prebuilt
      - name: Export counts and Windows format limit
        run: python tools/prebuilt_game.py exports prebuilt
      - name: Two mod libraries share the game's exact Rust state
        run: python tools/native_dylib_probe.py --sdk prebuilt --output target/native-dylib-probe
      - name: Probe command log
        if: failure()
        run: tail -n 120 target/native-dylib-probe/commands.log
