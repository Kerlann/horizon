name: dyna-checks
run-name: ${{ github.event.pull_request.title || github.event.head_commit.message || github.workflow }}
# Fork-only checks. Keep upstream's workflows byte-identical; disable checks (ci.yml)
# in the fork's Actions settings after this workflow's verify passes on main.
# Scheduled events run only the hosted dispatcher; the dispatched run uses Dyna.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new push to a pull request replaces its running checks. Main runs are never cancelled: a run in
  # progress finishes, and only the newest waiting push runs next, so main is always checked.
  group: dyna-checks-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Dyna runners accept dispatches, not scheduled events.
  nightly-dispatch:
    if: github.repository == 'arismoko/horizon' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dyna-ci.yml --repo "$GITHUB_REPOSITORY" --ref main

  # Dyna's image enforces the event and repository check again in job-started.sh.
  # GitHub's external-contributor approval is the third lock.
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      self_hosted: ${{ steps.runner.outputs.self_hosted }}
      # The ignored-tests shard matrix: every shard on main, the affected ones on a pull request (empty: none).
      ignored_matrix: ${{ steps.matrix.outputs.matrix || '{"shard":[]}' }}
      # Whether the wasm runtime, the mod API or its generator changed: on main, always.
      wasm: ${{ steps.wasm.outputs.wasm }}
    steps:
      - uses: actions/checkout@v4
        with:
          # ignored_shards.py diffs the pull request's full range, like the shard jobs do.
          fetch-depth: 0
      - id: runner
        env:
          ENABLED: ${{ vars.DYNA_CI_SELF_HOSTED }}
          LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash tools/ci/dyna_ci_runner.sh >> "$GITHUB_OUTPUT"
      - name: The ignored-tests shard matrix
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = push ]; then
            python3 tools/ci/ignored_shards.py --matrix --all >> "$GITHUB_OUTPUT"
          else
            python3 tools/ci/ignored_shards.py --matrix "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Does this change touch wasm mods?
        id: wasm
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = push ] || git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qE '^(crates/(horizon-mod-api|horizon-mod-api-gen|horizon-mod-wasm|horizon-mods)/|Cargo\.lock$)'; then
            echo wasm=true >> "$GITHUB_OUTPUT"
          else
            echo wasm=false >> "$GITHUB_OUTPUT"
          fi

  pool-watch:
    needs: changes
    if: needs.changes.outputs.self_hosted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/dyna_ci_pool_watch.py

  # One job, not one per check: each job takes a runner from the organisation's shared pool, and with every pull request
  # and every merge to main starting this workflow, three jobs a run left the pool's queue tens of minutes deep.
  #
  # Dyna's slot shares a 40 GiB persistent cache between verify and launcher; the pool wipes it above that size.
  # Where: Dyna when its switch and lease allow it, otherwise GitHub's runners. With the repository variable
  # SELF_HOSTED_CI=all (for when that pool is full: their 4 CPUs
  # are about one GitHub runner, docs/ci-runners.md), main's pushes and this repository's own pull requests run on
  # playhorizon's checks runners (label playhorizon-ci); a fork's pull request never does (and the runners refuse it
  # themselves). There the build folder persists (CARGO_TARGET_DIR, outside the checkout), so the apt packages,
  # Python and the Rust cache steps are GitHub's only.
  # Formatting and clippy on GitHub's own runners, in parallel with verify's tests on Dyna's: the fork's account has
  # its own hosted pool, so both pools work on every run and a run's wall time is the longer of the two, not the sum.
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this pull request need Rust checks?
        if: github.event_name == 'pull_request'
        id: rust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain and the ALSA and udev headers the client links against
        if: steps.rust.outputs.required != 'false'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.rust.outputs.required != 'false'
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting and lint
        if: steps.rust.outputs.required != 'false'
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets -- -D warnings
          # The server build (released as horizon-engine): the game without sound or controllers.
          cargo +stable clippy -p horizon-client --all-targets --no-default-features -- -D warnings

  wasm-mods:
    # A mod built to mod.wasm and loaded as the game loads it; the mod API's generated WIT as an
    # artifact, and what this change does to it in the job summary (a report, never a failure).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchains and the ALSA and udev headers
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install stable --profile minimal
          rustup toolchain install 1.99.1 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-mods
          workspaces: |
            .
            docs/modding/examples/wasm-hello -> target/horizon-mod
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The mod API and the points crate build for wasm32
        run: cargo +1.99.1 check -p horizon-mod-api -p horizon-mod-points --target wasm32-unknown-unknown
      - name: Build the sample to mod.wasm, and the std member the game ships
        run: |
          cargo +stable build -p cargo-horizon-mod -p xtask
          cd docs/modding/examples/wasm-hello
          ../../../../target/debug/cargo-horizon-mod horizon-mod build --wasm
          ../../../../target/debug/cargo-horizon-mod horizon-mod wasm-std "$GITHUB_WORKSPACE/target/horizon-wasm-std.wasm"
      - name: Load it in the runtime
        env:
          HORIZON_WASM_SAMPLE: ${{ github.workspace }}/docs/modding/examples/wasm-hello/target/horizon-mod/hello_wasm.hmod
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
        run: cargo +stable test -p horizon-mod-wasm --test sample -- --ignored
      - name: Mods sharing a library, linked in one group, and a mod of another group
        env:
          HORIZON_WASM_GROUPS: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/groups
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
        run: |
          for mod in counter_lib alpha beta gamma; do
            (cd "$HORIZON_WASM_GROUPS/$mod" && "$GITHUB_WORKSPACE/target/debug/cargo-horizon-mod" horizon-mod build --wasm)
          done
          cargo +stable test -p horizon-mod-wasm --test groups -- --ignored
      - name: The mod API's WIT, and what this change does to it
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          target/debug/xtask mod-api wit target/wit-head
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git worktree add -q ../wit-base "$BASE_SHA"
            # The base's own generator reads the base's catalog: the head's xtask doesn't know
            # the base's layout. A base that can't build its WIT fails the step.
            (cd ../wit-base && cargo +stable run -q -p xtask -- mod-api wit "$GITHUB_WORKSPACE/target/wit-base")
          fi
          if [ -f target/wit-base/mod-api.wit ]; then
            python3 tools/ci/wit_report.py target/wit-base/mod-api.wit target/wit-head/mod-api.wit >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No mod-api.wit to compare with at $BASE_SHA: this is the first." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mod-api-wasm
          path: |
            target/wit-head/mod-api.wit
            target/horizon-wasm-std.wasm
            docs/modding/examples/wasm-hello/target/horizon-mod/hello_wasm.hmod

  wasm-bench:
    # What a wasm mod costs against the same mod built native, in release: a table in the job
    # summary (a report, never a failure; timings on shared runners are indicative). Only when
    # the wasm runtime, the mod API or its generator changed.
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchains and the ALSA and udev headers
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install stable --profile minimal
          rustup toolchain install 1.99.1 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-bench
          workspaces: |
            .
            crates/horizon-mod-wasm/tests/bench -> target/horizon-mod
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the benchmark mod to mod.wasm, and the std member
        run: |
          cargo +stable build -p cargo-horizon-mod
          cd crates/horizon-mod-wasm/tests/bench
          ../../../../target/debug/cargo-horizon-mod horizon-mod build --wasm
          ../../../../target/debug/cargo-horizon-mod horizon-mod wasm-std "$GITHUB_WORKSPACE/target/horizon-wasm-std.wasm"
      - name: The same hook native and as mod.wasm
        env:
          HORIZON_WASM_BENCH: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/bench/target/horizon-mod/bench_mod.hmod
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
        run: cargo +stable test --release -p horizon-mod-wasm --test bench -- --ignored --nocapture

  verify:
    needs: changes
    runs-on: ${{ needs.changes.outputs.self_hosted == 'true' && 'dyna-medium' || vars.SELF_HOSTED_CI == 'all' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "playhorizon-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    # Dyna's runner image now carries lavapipe, Mesa's software Vulkan driver, for ignored-tests' `gpu` tests.
    # verify's tests were written to skip GPU work when no adapter exists, and one of them
    # (gfx::frame_gen::optical_flow, horizon-rust/horizon#8627) fails on lavapipe, so verify hides the driver and runs
    # exactly as before. ignored-tests is where the GPU tests run.
    env:
      VK_ICD_FILENAMES: /nonexistent/no-vulkan-in-verify.json
      VK_DRIVER_FILES: /nonexistent/no-vulkan-in-verify.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - name: Does this pull request need Rust checks?
        if: github.event_name == 'pull_request'
        id: rust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # A pull request adds only its own commits to main, so it reads those; main's pushes read every ref's history.
      - name: Keep game artifacts out of Git
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/check_public_tree.py
          if [ "$EVENT" = pull_request ]; then
            python3 tools/check_public_tree.py --range "$BASE_SHA..$HEAD_SHA"
          else
            python3 tools/check_public_tree.py --history
          fi
      - name: Check duplicate public native functions
        run: python3 tools/sync_upstream.py --check
      - name: Test offline research tooling
        run: python3 -m unittest discover -s tests -v
      - name: Install Dyna runner dependencies without root
        if: steps.rust.outputs.required != 'false' && needs.changes.outputs.self_hosted == 'true'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain and the ALSA and udev headers the client links against
        if: steps.rust.outputs.required != 'false'
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
          DYNA: ${{ needs.changes.outputs.self_hosted }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          elif [ "$DYNA" = true ]; then
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      # Dependencies and the workspace's own build, saved from main's runs (pull requests read main's cache).
      - uses: Swatinem/rust-cache@v2
        if: steps.rust.outputs.required != 'false' && runner.environment == 'github-hosted'
        with:
          shared-key: verify
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A dyna-medium runner has a hard 8 GiB limit and 4 CPUs; four horizon-client rustc processes at about 2.6 GB
      # each go past it, so Dyna runs build two crates at a time. Formatting and lint run in parallel on GitHub's
      # runners (the lint job), so this job only tests. A cargo flag, not CARGO_BUILD_JOBS: sccache hashes
      # CARGO_* variables, and that would split the runners' cache from the boxes'.
      # Libraries, binaries and integration tests, then doc tests: not the ~275 examples, which clippy above already
      # type-checks and the parity job builds and runs (they were most of this step's build and link time).
      # cargo test, not nextest: nextest's process per test reloads each binary's shared tables for every test, and on
      # these 4-core runners it was no faster (#4978).
      - name: Test Rust core and voxel kernel correctness
        if: steps.rust.outputs.required != 'false'
        env:
          JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j2' || '' }}
        run: |
          cargo +stable test $JOBS --workspace --lib --bins --tests
          # The full content-root tests (#[ignore]d: minutes each on a laptop). The same build as above; they need the
          # prepared vanilla data, so without it they pass at once. Keep the target selection identical to avoid
          # recompiling the workspace with a different dependency graph.
          cargo +stable test $JOBS --workspace --lib --bins --tests mod_content::tests:: -- --ignored
          cargo +stable test $JOBS --workspace --doc
  # The #[ignore]d library tests that need the prepared vanilla data, which verify doesn't have. Main's pushes and this
  # repository's own pull requests only, on Dyna's large runner where that data lives; a fork's pull request never
  # runs here. One package per shard (the plan lives in tools/ci/ignored_shards.py, measured when it was cut: about
  # 380s, 279s and 189s of tests), so the wall time stays under verify's; a pull request runs only the shards its
  # changed crates can affect. tools/ci/ignored_tests.py fails on a new failure and on a known one that passes, and
  # prints only test names and results: the data is Mojang's.
  ignored-tests-shards:
    needs: changes
    # The matrix holds only the shards to run, so an empty one (a pull request that needs
    # none) skips the job instead of expanding to nothing, which GitHub refuses.
    if: >-
      needs.changes.outputs.self_hosted == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) &&
      fromJSON(needs.changes.outputs.ignored_matrix).shard[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.ignored_matrix) }}
    runs-on: dyna-large
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Dyna runner dependencies
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          fi
          rustup toolchain install stable --profile minimal
      # Not every dyna-large runner has the data yet. A pull request's run skips the tests there; a push to main fails.
      - name: Link prepared vanilla data
        id: data
        env:
          EVENT: ${{ github.event_name }}
        run: |
          for dir in minecraft datagen horizon-client tools; do
            if [ ! -d "/cache/horizon-local/$dir" ]; then
              echo "no prepared data on this runner ($RUNNER_NAME): /cache/horizon-local/$dir is missing"
              if [ "$EVENT" = push ]; then exit 1; fi
              echo "present=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          mkdir -p .local
          for dir in minecraft datagen horizon-client tools; do
            ln -sfn "/cache/horizon-local/$dir" ".local/$dir"
          done
      - name: Run the ignored tests that need prepared data
        if: steps.data.outputs.present != 'false'
        env:
          RUSTUP_TOOLCHAIN: stable
          SHARD: ${{ matrix.shard }}
        run: |
          export HORIZON_TEST_RESOURCES="$PWD/.local/horizon-client/26.3"
          python3 tools/ci/ignored_tests.py "$SHARD"
  # The one check branch protection requires: green when every shard ran green or was skipped as unaffected.
  ignored-tests:
    needs: [changes, ignored-tests-shards]
    if: >-
      always() && !cancelled() &&
      needs.changes.outputs.self_hosted == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every ignored-tests shard passed or was skipped
        run: |
          result="${{ needs.ignored-tests-shards.result }}"
          case "$result" in
            success | skipped) echo "ignored-tests shards: $result" ;;
            *) echo "::error::ignored-tests shards: $result" && exit 1 ;;
          esac
  # The launcher is its own workspace (launcher/Cargo.toml), so verify's cargo runs never build it. A pull request that
  # changes it or a crate it builds is checked here, and so is every push to main: two pull requests can each pass
  # alone and break it together (#2059 and the registry ratings did, 2026-10-26).
  launcher:
    needs: changes
    runs-on: ${{ needs.changes.outputs.self_hosted == 'true' && 'dyna-medium' || vars.SELF_HOSTED_CI == 'all' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "playhorizon-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this pull request change the launcher or a crate it builds?
        if: github.event_name == 'pull_request'
        id: launcher
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py --launcher "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Install Dyna runner dependencies without root
        if: steps.launcher.outputs.required != 'false' && needs.changes.outputs.self_hosted == 'true'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust and the headers GPUI links against
        if: steps.launcher.outputs.required != 'false'
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
          DYNA: ${{ needs.changes.outputs.self_hosted }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-x11-dev libwayland-dev \
              libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
          elif [ "$DYNA" = true ]; then
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.launcher.outputs.required != 'false' && runner.environment == 'github-hosted'
        with:
          workspaces: launcher
          shared-key: launcher
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the launcher's formatting, lint and tests
        if: steps.launcher.outputs.required != 'false'
        working-directory: launcher
        env:
          JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j2' || '' }}
        run: |
          cargo +stable fmt --check
          cargo +stable clippy $JOBS --all-targets --locked -- -D warnings
          cargo +stable test $JOBS --locked --lib --bins
  # The fork's Dyna runners have the owner's prepared vanilla data in a read-only cache.
  vanilla-parity:
    if: github.repository == 'arismoko/horizon' && github.event_name == 'workflow_dispatch'
    runs-on: dyna-large
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Dyna runner dependencies
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Use system Python for parity harnesses
        run: |
          mkdir -p "$DYNA_CI_BUILD/bin"
          ln -sf "$GITHUB_WORKSPACE/tools/ci/dyna_parity_python.sh" "$DYNA_CI_BUILD/bin/python"
          echo "$DYNA_CI_BUILD/bin" >> "$GITHUB_PATH"
      - name: Install Rust toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          fi
          rustup toolchain install stable --profile minimal
      - name: Set up disk-backed parity scratch and link prepared vanilla data
        run: |
          rm -rf "$DYNA_CI_BUILD/parity-out" "$DYNA_CI_BUILD/parity-tmp"
          mkdir -p "$DYNA_CI_BUILD/parity-out" "$DYNA_CI_BUILD/parity-tmp"
          ln -s "$DYNA_CI_BUILD/parity-out" .local
          echo "TMPDIR=$DYNA_CI_BUILD/parity-tmp" >> "$GITHUB_ENV"
          for dir in minecraft datagen horizon-client tools; do
            test -d "/cache/horizon-local/$dir"
            ln -s "/cache/horizon-local/$dir" ".local/$dir"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Harness subprocess timeouts can be shorter than a cold release build. Match their build commands and target dir.
