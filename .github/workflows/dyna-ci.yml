name: mob-dispatch-proof
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
jobs:
  focused:
    runs-on: dyna-large
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify production and test sources match the published draft
        run: git diff --exit-code 1efaec6c2a0151d6f99930dee998f5acc09dcf0e -- crates/ Cargo.toml Cargo.lock
      - name: Install Dyna runner dependencies
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          fi
          rustup toolchain install stable --profile minimal
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare private vanilla resources, fail rather than skip if unavailable
        run: |
          for dir in minecraft datagen horizon-client tools; do
            test -d "/cache/horizon-local/$dir"
          done
          HORIZON_DYNA_CACHE=true HORIZON_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" HORIZON_SHARED_SOURCE=/cache/horizon-local bash tools/ci/vanilla-data.sh
      - name: Actual resource regression and scoped compiler profile evidence
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          export HORIZON_TEST_RESOURCES="$PWD/.local/horizon-client/26.3"
          export HORIZON_HOME="$(mktemp -d)"
          export HORIZON_NO_AUDIO=1
          flags=()
          if [ "$MODE" = optimized ]; then
            for package in horizon-client horizon-client-lib; do
              flags+=(--config "profile.test.package.$package.opt-level=1")
              flags+=(--config "profile.test.package.$package.debug-assertions=false")
            done
          fi
          cargo +stable "${flags[@]}" test -j 4 -p horizon-client --lib --message-format=json-render-diagnostics mob_despawn_listener_panic_preserves_owned_rows_and_lent_random -- --ignored --test-threads=1 --nocapture | tee "mob-build-$MODE.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mob-profile-${{ matrix.mode }}
          path: mob-build-*.jsonl
