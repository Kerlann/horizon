name: wasm-mods
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/cargo-horizon-mod/**'
      - 'crates/horizon-mod-*/**'
      - '.github/workflows/wasm-mods.yml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wasm-mods-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture:
    # Drafts skip it: the shared runners go to ready PRs (CI rule, 2026-11-08).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'dyna-large' }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rust-src
          targets: wasm32-unknown-unknown
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
      - name: Build tool and shared member
        run: |
          cargo build -p cargo-horizon-mod
          cd crates/horizon-mod-wasm/tests/fixture
          "$GITHUB_WORKSPACE/target/debug/cargo-horizon-mod" horizon-mod build --wasm --catalog points.json
          "$GITHUB_WORKSPACE/target/debug/cargo-horizon-mod" horizon-mod wasm-std "$GITHUB_WORKSPACE/target/horizon-wasm-std.wasm" --catalog points.json
      - name: Validate and load the fixture
        env:
          HORIZON_WASM_FIXTURE: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/fixture/target/horizon-mod/wasm_fixture.hmod
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
        run: |
          cargo test -p horizon-mod-api --features wasm-guest --lib guest_pool_
          cargo test -p horizon-mod-wasm --test real_member -- --nocapture
          cargo test -p horizon-mod-wasm --lib guest_input_pool_stays_flat_for_100k_no_import_calls -- --ignored --nocapture
      - name: Build independent library members
        run: |
          tool="$GITHUB_WORKSPACE/target/debug/cargo-horizon-mod"
          root="$GITHUB_WORKSPACE/crates/horizon-mod-wasm/tests/library-fixture"
          for member in library observer dependent; do
            (cd "$root/$member" && "$tool" horizon-mod build --wasm --catalog "$root/points.json")
          done
      - name: Load independently built library members
        env:
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
          HORIZON_WASM_LIBRARY: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/library-fixture/library/target/horizon-mod/wasm_test_library.hmod
          HORIZON_WASM_OBSERVER: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/library-fixture/observer/target/horizon-mod/wasm_test_observer.hmod
          HORIZON_WASM_DEPENDENT: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/library-fixture/dependent/target/horizon-mod/wasm_test_dependent.hmod
        run: cargo test -p horizon-mod-wasm --test real_library -- --nocapture
      - name: Build the same-group capability members
        run: |
          tool="$GITHUB_WORKSPACE/target/debug/cargo-horizon-mod"
          groups="$GITHUB_WORKSPACE/crates/horizon-mod-wasm/tests/groups"
          catalog="$GITHUB_WORKSPACE/crates/horizon-mod-wasm/tests/library-fixture/points.json"
          for member in counter_lib alpha beta gamma hog; do
            (cd "$groups/$member" && "$tool" horizon-mod build --wasm --catalog "$catalog")
          done
      - name: Load the group members
        env:
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
          HORIZON_WASM_GROUPS: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/groups
        run: cargo test -p horizon-mod-wasm --test groups -- --nocapture
      - name: Measure block entity boundary
        if: github.event_name == 'workflow_dispatch'
        env:
          HORIZON_WASM_FIXTURE: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/fixture/target/horizon-mod/wasm_fixture.hmod
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
        run: cargo test --release -p horizon-mod-wasm --test bench block_entity_ticks -- --ignored --nocapture
